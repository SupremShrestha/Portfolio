<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('suprem-visual-theme');
          const theme = ['void', 'ion', 'pearl'].includes(saved) ? saved : 'void';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.motion = localStorage.getItem('suprem-motion') !== 'off' && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'on' : 'off';
          document.querySelector('meta[name="theme-color"]').content = { void: '#0a0b10', ion: '#10140c', pearl: '#eeeff4' }[theme];
        } catch { /* Defaults remain usable without browser storage. */ }
      })();
    </script>
    <meta name="description" content="Suprem Shrestha — Computer Science and AI student in Kathmandu, Nepal. Explore projects in artificial intelligence, web development, and thoughtful design." />
    <meta property="og:title" content="Suprem Shrestha — Developer & AI Explorer" />
    <meta property="og:description" content="Engineering ideas. Designing possibilities. Selected work, intelligent systems, and interactive experiments by Suprem Shrestha." />
    <meta property="og:type" content="website" />
    <title>Suprem Shrestha — Developer & AI Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
